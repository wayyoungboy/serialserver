name: Build and Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false

env:
  GO_VERSION: '1.25'

jobs:
  # ==================== Tests ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test vsp-server
        run: |
          cd vsp-server
          go test -v -race ./...

      - name: Test vsp-client
        run: |
          cd vsp-client
          go test -v -race ./...

      - name: Test vsp-windows
        run: |
          cd vsp-windows
          go test -v ./...

      - name: Test V2 serial relay E2E
        run: |
          cd tests/e2e
          go test -v ./...

      - name: Build vsp-windows frontend
        run: |
          cd vsp-windows/frontend
          npm ci
          npm run build

  # ==================== Server Build ====================
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Server
        run: |
          cd vsp-server
          CGO_ENABLED=1 go build -ldflags="-s -w" -o vsp-server ./cmd

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsp-server-linux
          path: vsp-server/vsp-server

  # ==================== V2 CLI Build (Linux/Windows) ====================
  build-v2-cli-clients:
    name: Build V2 CLI Clients
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build V2 CLI Clients
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd vsp-client
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -ldflags="-s -w" -o device-agent-v2-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/device-agent-v2
          go build -ldflags="-s -w" -o desktop-gateway-v2-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/desktop-gateway-v2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-cli-clients-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            vsp-client/device-agent-v2-${{ matrix.goos }}-${{ matrix.goarch }}*
            vsp-client/desktop-gateway-v2-${{ matrix.goos }}-${{ matrix.goarch }}*

  # ==================== V2 CLI Build (macOS - requires CGO) ====================
  build-v2-cli-clients-darwin:
    name: Build V2 CLI Clients (macOS)
    runs-on: macos-latest
    needs: [test]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build V2 CLI Clients
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          cd vsp-client
          go build -ldflags="-s -w" -o device-agent-v2-darwin-${{ matrix.goarch }} ./cmd/device-agent-v2
          go build -ldflags="-s -w" -o desktop-gateway-v2-darwin-${{ matrix.goarch }} ./cmd/desktop-gateway-v2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-cli-clients-darwin-${{ matrix.goarch }}
          path: |
            vsp-client/device-agent-v2-darwin-${{ matrix.goarch }}
            vsp-client/desktop-gateway-v2-darwin-${{ matrix.goarch }}

  # ==================== Windows Validation ====================
  validate-windows:
    name: Windows Validation
    runs-on: windows-latest
    needs: [build-server, build-v2-cli-clients, build-windows-client]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download V2 CLI Clients (Windows)
        uses: actions/download-artifact@v4
        with:
          name: v2-cli-clients-windows-amd64
          path: artifacts/client

      - name: Download VSPManager
        uses: actions/download-artifact@v4
        with:
          name: VSPManager-windows
          path: artifacts/vspmanager

      # 构建 Windows server
      - name: Build Windows Server
        run: |
          cd vsp-server
          go build -ldflags="-s -w" -o vsp-server.exe ./cmd

      # 构建测试程序
      - name: Build Test Programs
        run: |
          cd tests/test_programs
          go build -o test_x.exe ./test_x
          go build -o test_y.exe ./test_y

      # 验证构建产物
      - name: Verify Build Artifacts
        run: |
          Write-Host "验证构建产物..."

          # 检查 vsp-server
          if (Test-Path "vsp-server/vsp-server.exe") {
            Write-Host "vsp-server.exe 构建成功"
          } else {
            Write-Error "vsp-server.exe 构建失败"
            exit 1
          }

          # 检查 V2 CLI
          if (Test-Path "artifacts/client/device-agent-v2-windows-amd64.exe") {
            Write-Host "device-agent-v2.exe 构建成功"
          } else {
            Write-Error "device-agent-v2.exe 构建失败"
            exit 1
          }
          if (Test-Path "artifacts/client/desktop-gateway-v2-windows-amd64.exe") {
            Write-Host "desktop-gateway-v2.exe 构建成功"
          } else {
            Write-Error "desktop-gateway-v2.exe 构建失败"
            exit 1
          }

          # 检查 VSPManager
          if (Get-ChildItem "artifacts/vspmanager" -Recurse -Filter "VSPManager-windows-amd64.zip" -ErrorAction SilentlyContinue) {
            Write-Host "VSPManager 构建成功"
          } else {
            Write-Error "VSPManager 构建失败"
            exit 1
          }
          if (Get-ChildItem "artifacts/vspmanager" -Recurse -Filter "VSPManager-*-Setup.exe" -ErrorAction SilentlyContinue) {
            Write-Host "VSPManager 安装器构建成功"
          } else {
            Write-Error "VSPManager 安装器构建失败"
            exit 1
          }

          # 检查测试程序
          if (Test-Path "tests/test_programs/test_x.exe") { Write-Host "test_x.exe 构建成功" }
          if (Test-Path "tests/test_programs/test_y.exe") { Write-Host "test_y.exe 构建成功" }

      - name: Run vsp-windows Tests
        run: |
          cd vsp-windows
          go test -v ./...

  # ==================== Windows Client Build (Wails) ====================
  build-windows-client:
    name: Build Windows Client
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Windows Assets
        run: |
          cd vsp-windows
          go run tools/gen_windows_assets.go

      - name: Build Wails App
        run: |
          cd vsp-windows
          wails build -clean

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          cd vsp-windows
          New-Item -ItemType Directory -Force build/installer | Out-Null
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "0.2.0-ci" }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $candidates = @(
              (Join-Path $programFilesX86 "NSIS\makensis.exe"),
              (Join-Path $env:ProgramData "chocolatey\bin\makensis.exe")
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            Write-Error "makensis.exe was not found after installing NSIS."
            exit 1
          }
          & $makensis "/DAPP_VERSION=$version" packaging/windows/VSPManager.nsi

      - name: Create ZIP
        run: |
          cd vsp-windows/build/bin
          Compress-Archive -Path * -DestinationPath VSPManager-windows-amd64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSPManager-windows
          path: |
            vsp-windows/build/bin/VSPManager-windows-amd64.zip
            vsp-windows/build/installer/*.exe

  # ==================== Release ====================
  create-release:
    name: Create Release
    needs: [test, build-server, build-v2-cli-clients, build-v2-cli-clients-darwin, build-windows-client, validate-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
